<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحليل الدرجات</title>
</head>
<body>
    <h1>نظام تحليل الدرجات</h1>
    <script>
        class Student {
            constructor(name, id, grades) {
                this.name = name;
                this.id = id;
                this.grades = grades;
            }
            applyGraceMarks() {
                this.grades = this.grades.map(grade => {
                    if (grade === 48 || grade === 49) return 50;
                    return grade;
                });
            }
            analyzeGrades() {
                const total = this.grades.reduce((sum, g) => sum + g, 0);
                const max = this.grades.reduce((m, g) => Math.max(m, g), this.grades[0]);
                const min = this.grades.reduce((m, g) => Math.min(m, g), this.grades[0]);
                return { total, highest: max, lowest: min };
            }
        }

        const universitySystem = [];
        const student1 = new Student("أحمد محمد", 101, [48, 60, 75]);
        const student2 = new Student("سارة علي", 102, [45, 49, 40]);
        const student3 = new Student("منى أحمد", 103, [85, 90, 95]);

        const initialStudents = [student1, student2, student3];
        initialStudents.forEach(student => {
            student.applyGraceMarks();
            universitySystem.push(student);
        });

        const passedStudents = universitySystem.filter(student => {
            return student.grades.filter(g => g >= 50).length === student.grades.length;
        });

        const failedStudents = universitySystem.filter(student => {
            return student.grades.filter(g => g < 50).length > 0;
        });

        console.log("--- المصفوفة الشاملة ---", universitySystem);
        console.log("--- قائمة الناجحين ---", passedStudents);
        console.log("--- قائمة الراسبين ---", failedStudents);
    </script>
</body>
</html>
